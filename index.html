<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Hisob-kitob</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#FFF5FB; --surface:#FFFFFF; --surface-2:#FDF2FA;
  --ink:#160A24; --ink-2:#5C4A78; --ink-3:#9A88B6; --line:#F0DAEE;
  --violet:#8B00F5; --coral:#FF0F6B; --amber:#FFA800; --cyan:#00D5E0; --lime:#00C864;
  --violet-soft:#F5E4FF; --coral-soft:#FFDDEA; --lime-soft:#CFFCE6; --cyan-soft:#D2FAFD;
  --shadow:0 2px 8px rgba(22,10,36,.06), 0 16px 34px -20px rgba(22,10,36,.4);
  --r:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0616; --surface:#1A1030; --surface-2:#241640;
    --ink:#FFF2FC; --ink-2:#C6B2E4; --ink-3:#9781BE; --line:#3A2159;
    --violet:#C46BFF; --coral:#FF4D8D; --amber:#FFC24D; --cyan:#3DEEFA; --lime:#2BF08D;
    --violet-soft:#37135C; --coral-soft:#4A0F2C; --lime-soft:#0A3D26; --cyan-soft:#0B3D45;
    --shadow:0 2px 8px rgba(0,0,0,.5), 0 16px 34px -20px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --bg:#0B0616; --surface:#1A1030; --surface-2:#241640;
  --ink:#FFF2FC; --ink-2:#C6B2E4; --ink-3:#9781BE; --line:#3A2159;
  --violet:#C46BFF; --coral:#FF4D8D; --amber:#FFC24D; --cyan:#3DEEFA; --lime:#2BF08D;
  --violet-soft:#37135C; --coral-soft:#4A0F2C; --lime-soft:#0A3D26; --cyan-soft:#0B3D45;
  --shadow:0 2px 8px rgba(0,0,0,.5), 0 16px 34px -20px rgba(0,0,0,.95);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(30rem 18rem at 6% -4%, rgba(255,15,107,.18), transparent 62%),
    radial-gradient(26rem 18rem at 98% 2%, rgba(0,213,224,.20), transparent 64%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#app{max-width:520px;margin:0 auto;padding:14px 14px calc(86px + var(--safe-b));}
.screen{display:none;animation:in .28s cubic-bezier(.2,.8,.3,1)}
.screen.on{display:flex;flex-direction:column;gap:14px}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* ---------- sarlavha ---------- */
.head{display:flex;align-items:center;gap:12px;padding:4px 2px 0}
.head .hi{font-family:Outfit,sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em}
.head .dt{font-size:12.5px;color:var(--ink-3)}
.head .av{
  margin-left:auto;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--violet),var(--coral));color:#fff;
  font-family:Outfit,sans-serif;font-weight:800;font-size:16px;
}

/* ---------- hero ---------- */
.hero{
  border-radius:24px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--violet),var(--coral) 55%,var(--amber));
  box-shadow:0 18px 40px -22px rgba(139,0,245,.85);
}
.hero::after{
  content:"";position:absolute;inset:-40% -20% auto auto;width:220px;height:220px;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%);
}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.9}
.hero .val{font-family:"Roboto Mono",monospace;font-weight:700;font-size:32px;letter-spacing:-.03em;margin-top:2px}
.hero .sub{font-size:13px;opacity:.92;margin-top:3px}
.hero .chips{display:flex;gap:8px;margin-top:13px;position:relative}
.hero .chips div{
  flex:1;background:rgba(255,255,255,.2);border-radius:13px;padding:8px 10px;font-size:12px;
  backdrop-filter:blur(4px);
}
.hero .chips b{display:block;font-family:"Roboto Mono",monospace;font-size:15px;margin-top:1px}

/* ---------- biznes kartalari ---------- */
.bcard{
  border-radius:var(--r);padding:15px 17px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.bcard .nm{font-family:Outfit,sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:7px}
.bcard .kassa{font-family:"Roboto Mono",monospace;font-weight:700;font-size:25px;letter-spacing:-.03em;margin-top:8px}
.bcard .kl{font-size:12px;opacity:.9}
.bcard .split{display:flex;gap:8px;margin-top:11px}
.bcard .split div{flex:1;background:rgba(255,255,255,.22);border-radius:12px;padding:7px 10px;font-size:11.5px}
.bcard .split b{display:block;font-family:"Roboto Mono",monospace;font-size:14px;margin-top:1px}
.bcard .today{display:flex;gap:14px;margin-top:11px;font-size:12.5px}
.bcard .today b{font-family:"Roboto Mono",monospace}

/* ---------- statlar ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow)}
.stat.up{background:var(--lime-soft)} .stat.down{background:var(--coral-soft)}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.stat .v{font-family:"Roboto Mono",monospace;font-weight:700;font-size:18px;margin-top:2px}
.stat.up .v{color:var(--lime)} .stat.down .v{color:var(--coral)}

.fabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{
  border-radius:17px;padding:15px;text-align:center;color:#fff;font-family:Outfit,sans-serif;
  font-weight:700;font-size:16px;transition:transform .12s;
}
.fab:active{transform:scale(.96)}
.fab.in{background:linear-gradient(120deg,var(--lime),var(--cyan))}
.fab.out{background:linear-gradient(120deg,var(--coral),var(--amber))}

/* ---------- ro'yxat ---------- */
.sect-t{font-family:Outfit,sans-serif;font-weight:700;font-size:15px;margin:4px 2px -4px;
  display:flex;align-items:center;gap:8px}
.sect-t span{margin-left:auto;font-size:12px;color:var(--ink-3);font-family:"Plus Jakarta Sans",sans-serif;font-weight:500}
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:11px;background:var(--surface);
  border-radius:15px;padding:11px 13px;box-shadow:var(--shadow);transition:transform .12s;
}
.item:active{transform:scale(.985)}
.item .bead{width:5px;align-self:stretch;border-radius:4px;flex-shrink:0}
.item .t{flex:1;min-width:0}
.item .t .a{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t .b{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.item .amt{font-family:"Roboto Mono",monospace;font-weight:700;font-size:14.5px;white-space:nowrap}
.amt.up{color:var(--lime)} .amt.down{color:var(--coral)}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:26px 10px}
.empty .e{font-size:34px;display:block;margin-bottom:6px}

/* ---------- segment ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:15px;padding:4px;gap:4px}
.seg button{
  flex:1;padding:9px 6px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  transition:.16s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on[data-v="Kirim"]{background:linear-gradient(120deg,var(--lime),var(--cyan));color:#fff}
.seg button.on[data-v="Chiqim"]{background:linear-gradient(120deg,var(--coral),var(--amber));color:#fff}
.seg.biz button.on{color:#fff}

/* ---------- kiritish ---------- */
.amountbox{
  border-radius:22px;padding:16px;text-align:center;color:#fff;
  background:linear-gradient(135deg,var(--violet),var(--coral));
  box-shadow:0 16px 34px -22px rgba(255,15,107,.9);
}
.amountbox .n{font-family:"Roboto Mono",monospace;font-weight:700;font-size:34px;letter-spacing:-.03em;
  min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
.amountbox .n.small{font-size:26px}
.amountbox .u{font-size:12.5px;opacity:.92;margin-top:1px}
.izoh{
  width:100%;background:var(--surface);border-radius:15px;padding:13px 15px;font-size:14.5px;
  border:1.5px solid var(--line);color:var(--ink);outline:none;
}
.izoh:focus{border-color:var(--violet)}
.izoh::placeholder{color:var(--ink-3)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{
  background:var(--surface);border-radius:15px;padding:14px 0;text-align:center;
  font-family:"Roboto Mono",monospace;font-weight:700;font-size:20px;box-shadow:var(--shadow);
  transition:transform .1s,background .1s;
}
.key:active{transform:scale(.94);background:var(--surface-2)}
.key.usd{background:linear-gradient(120deg,var(--amber),#FFD34D);color:#3A2A00}
.key.usd.on{background:linear-gradient(120deg,var(--violet),var(--coral));color:#fff}
.key.del{color:var(--coral)}
.save{
  width:100%;border-radius:17px;padding:16px;color:#fff;font-family:Outfit,sans-serif;
  font-weight:800;font-size:17px;background:linear-gradient(120deg,var(--violet),var(--coral));
  box-shadow:0 16px 32px -18px rgba(139,0,245,.9);transition:transform .12s,opacity .2s;
}
.save:active{transform:scale(.97)}
.save[disabled]{opacity:.45}

/* ---------- grafik ---------- */
.chartbox{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.chart{display:flex;align-items:flex-end;gap:6px;height:132px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bar .stack{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;flex:1}
.bar i{display:block;border-radius:6px 6px 0 0;min-height:2px;
  animation:grow .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}to{transform:none}}
.bar em{font-style:normal;font-size:10px;color:var(--ink-3);text-align:center;
  font-family:"Roboto Mono",monospace;margin-top:5px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--ink-2);margin-top:12px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bigline{
  border-radius:var(--r);padding:16px 18px;color:#fff;
  background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:var(--shadow);
}
.bigline .l{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.9}
.bigline .v{font-family:"Roboto Mono",monospace;font-weight:700;font-size:28px;letter-spacing:-.03em}
.bigline .s{font-size:13px;opacity:.9}
.xlsx{
  display:block;text-align:center;background:var(--surface);border-radius:16px;padding:14px;
  font-weight:700;color:var(--violet);box-shadow:var(--shadow);text-decoration:none;
}

/* ---------- tab bar ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
  box-shadow:0 -8px 24px -18px rgba(22,10,36,.5);
}
.tabs button{flex:1;padding:9px 2px 10px;font-size:10.5px;color:var(--ink-3);transition:.16s}
.tabs button .ic{display:block;font-size:20px;margin-bottom:1px;transition:transform .18s}
.tabs button.on{color:var(--coral);font-weight:700}
.tabs button.on .ic{transform:translateY(-2px) scale(1.12)}

/* ---------- toast / modal ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;
  font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.good{background:linear-gradient(120deg,var(--lime),var(--cyan));color:#04231A}
#toast.bad{background:linear-gradient(120deg,var(--coral),var(--amber));color:#fff}
.sheet{
  position:fixed;inset:0;z-index:50;background:rgba(10,4,20,.5);display:none;
  align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.sheet .in{
  background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + var(--safe-b));animation:up .25s cubic-bezier(.2,.8,.3,1)
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-family:Outfit,sans-serif;margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 16px;color:var(--ink-2);font-size:14.5px}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .b{border-radius:15px;padding:14px;text-align:center;font-weight:700}
.sheet .b.no{background:var(--surface-2);color:var(--ink)}
.sheet .b.yes{background:linear-gradient(120deg,var(--coral),var(--amber));color:#fff}

.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));
  background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r);height:120px}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>

<div id="app">
  <!-- BOSH -->
  <div class="screen on" id="s-home">
    <div class="head">
      <div>
        <div class="hi" id="hi">Salom!</div>
        <div class="dt" id="dt">—</div>
      </div>
      <div class="av" id="av">B</div>
    </div>
    <div id="home-body"><div class="skel"></div></div>
  </div>

  <!-- YOZISH -->
  <div class="screen" id="s-add">
    <div class="head"><div><div class="hi">Yangi yozuv</div><div class="dt">Tez va oddiy</div></div></div>
    <div class="seg" id="seg-tur">
      <button class="on" data-v="Kirim">🟢 Kirim</button>
      <button data-v="Chiqim">🔴 Chiqim</button>
    </div>
    <div class="seg biz" id="seg-biz"></div>
    <div class="amountbox">
      <div class="n" id="amt">0</div>
      <div class="u" id="amt-sub">so'm</div>
    </div>
    <div class="seg" id="seg-tolov">
      <button class="on" data-v="Naqd">💵 Naqd</button>
      <button data-v="Karta">💳 Karta</button>
      <button data-v="Qarzga">📝 Qarzga</button>
    </div>
    <input class="izoh" id="izoh" placeholder="📝 Izoh — nima uchun?" maxlength="120">
    <div class="keys">
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key usd" id="k-usd">$</button>
      <button class="key" data-k="0">0</button>
      <button class="key del" data-k="del">⌫</button>
    </div>
    <button class="save" id="save" disabled>Saqlash</button>
  </div>

  <!-- TARIX -->
  <div class="screen" id="s-hist">
    <div class="head"><div><div class="hi">Tarix</div><div class="dt" id="hist-sub">—</div></div></div>
    <div class="seg" id="seg-filter"></div>
    <div id="hist-body"><div class="skel"></div></div>
  </div>

  <!-- HISOBOT -->
  <div class="screen" id="s-rep">
    <div class="head"><div><div class="hi">Hisobot</div><div class="dt">Oxirgi 7 kun va shu oy</div></div></div>
    <div id="rep-body"><div class="skel"></div></div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button class="on" data-s="home"><span class="ic">🏠</span>Bosh</button>
  <button data-s="add"><span class="ic">✏️</span>Yozish</button>
  <button data-s="hist"><span class="ic">📜</span>Tarix</button>
  <button data-s="rep"><span class="ic">📊</span>Hisobot</button>
</div>

<div id="toast"></div>

<div class="sheet" id="sheet">
  <div class="in">
    <h3 id="sh-t">Yozuvni o'chirish?</h3>
    <p id="sh-p">Bu amalni qaytarib bo'lmaydi.</p>
    <div class="row">
      <button class="b no" id="sh-no">Bekor</button>
      <button class="b yes" id="sh-yes">O'chirish</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); } catch(e){} }

const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));

function buzz(kind){
  try { if (TG && TG.HapticFeedback) {
    if (kind === 'ok') TG.HapticFeedback.notificationOccurred('success');
    else if (kind === 'err') TG.HapticFeedback.notificationOccurred('error');
    else TG.HapticFeedback.impactOccurred('light');
  } } catch(e){}
}
const fmt = n => Math.round(n||0).toLocaleString('ru-RU').replace(/ /g,' ');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastT;
function toast(msg, kind){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'on ' + (kind||'');
  clearTimeout(toastT);
  toastT = setTimeout(()=>{ t.className=''; }, 2200);
}

/* ---------- server bilan aloqa ---------- */
const INIT = TG && TG.initData ? TG.initData : '';
async function api(path, body){
  const opt = { headers: {'X-Init-Data': INIT} };
  if (body){ opt.method='POST'; opt.headers['Content-Type']='application/json';
             opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) throw new Error("Ruxsat yo'q. Botga /start yozing.");
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

let S = null;                 // holat
function bugunISO(){ return (S && S.bugun_iso) ? S.bugun_iso
  : new Date().toISOString().slice(0,10); }
let sel = { tur:'Kirim', biz:null, tolov:'Naqd', usd:false, raqam:'' };
let filterBiz = 0;

/* ---------- ekranlar ---------- */
function show(name){
  $$('.screen').forEach(e => e.classList.toggle('on', e.id === 's-'+name));
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.s === name));
  window.scrollTo({top:0, behavior:'instant'});
  if (TG){ try { name==='home' ? TG.BackButton.hide() : TG.BackButton.show(); } catch(e){} }
}
$$('#tabs button').forEach(b => b.onclick = () => { buzz(); show(b.dataset.s); });
if (TG){ try { TG.BackButton.onClick(()=>show('home')); } catch(e){} }

/* ---------- BOSH ---------- */
function grad(b){ return `linear-gradient(135deg, ${b.rang[0]}, ${b.rang[1]})`; }

function renderHome(){
  const admin = S.user.admin;
  $('#hi').textContent = 'Salom, ' + (S.user.nomi || '').split(' ')[0] + '!';
  $('#dt').textContent = S.sana;
  $('#av').textContent = (S.user.nomi||'?').trim().charAt(0).toUpperCase();

  let kirim = 0, chiqim = 0, naqd = 0, karta = 0;
  S.bizneslar.forEach(b => {
    kirim += b.bugun.kirim; chiqim += b.bugun.chiqim;
    if (b.kassa){ naqd += b.kassa.Naqd; karta += b.kassa.Karta; }
  });

  let h = '';
  if (admin){
    h += `<div class="hero">
      <div class="lbl">Kassada jami</div>
      <div class="val">${fmt(naqd+karta)}</div>
      <div class="sub">so'm · ≈ $${((naqd+karta)/S.kurs).toFixed(2)}</div>
      <div class="chips">
        <div>💵 Naqd<b>${fmt(naqd)}</b></div>
        <div>💳 Karta<b>${fmt(karta)}</b></div>
      </div></div>`;
  } else {
    h += `<div class="hero">
      <div class="lbl">Bugungi foyda</div>
      <div class="val">${fmt(kirim-chiqim)}</div>
      <div class="sub">so'm</div></div>`;
  }

  S.bizneslar.forEach(b => {
    h += `<div class="bcard" style="background:${grad(b)}">
      <div class="nm">${esc(b.emoji)} ${esc(b.nomi)}</div>`;
    if (b.kassa){
      const ogoh = k => k < 0 ? ' ⚠️' : '';
      h += `<div class="kassa">${fmt(b.kassa.Naqd + b.kassa.Karta)}</div>
        <div class="kl">kassada, so'm</div>
        <div class="split">
          <div>💵 Naqd<b>${fmt(b.kassa.Naqd)}${ogoh(b.kassa.Naqd)}</b></div>
          <div>💳 Karta<b>${fmt(b.kassa.Karta)}${ogoh(b.kassa.Karta)}</b></div>
        </div>`;
    } else {
      h += `<div class="kassa">${fmt(b.bugun.kirim - b.bugun.chiqim)}</div>
        <div class="kl">bugungi foyda, so'm</div>`;
    }
    h += `<div class="today">
        <span>🟢 <b>${fmt(b.bugun.kirim)}</b></span>
        <span>🔴 <b>${fmt(b.bugun.chiqim)}</b></span>
      </div></div>`;
  });

  h += `<div class="grid2">
      <div class="stat up"><div class="l">Bugun kirim</div><div class="v">${fmt(kirim)}</div></div>
      <div class="stat down"><div class="l">Bugun chiqim</div><div class="v">${fmt(chiqim)}</div></div>
    </div>
    <div class="fabs">
      <button class="fab in" data-new="Kirim">＋ Kirim</button>
      <button class="fab out" data-new="Chiqim">− Chiqim</button>
    </div>`;

  if (admin && S.bizneslar.some(b => b.kassa && (b.kassa.Naqd < 0 || b.kassa.Karta < 0))){
    h += `<div class="stat down" style="border-radius:16px">
      <div class="l">⚠️ Diqqat</div>
      <div style="font-size:13.5px;margin-top:3px;color:var(--ink-2)">
        Kassa minusda — yozuv tushib qolgan bo'lishi mumkin.</div></div>`;
  }

  const oxirgi = S.oxirgi.slice(0, 5);
  h += `<div class="sect-t">Oxirgi yozuvlar <span>${S.oxirgi.length} ta</span></div>`;
  h += oxirgi.length ? `<div class="list">${oxirgi.map(itemHTML).join('')}</div>`
                     : `<div class="empty"><span class="e">🌱</span>Hali yozuv yo'q</div>`;

  if (S.qarzlar.length){
    const ol = S.qarzlar.filter(d=>d.turi==='Men qarz berdim')
                        .reduce((a,d)=>a+d.qoldiq,0);
    const ber = S.qarzlar.filter(d=>d.turi==='Men qarz oldim')
                         .reduce((a,d)=>a+d.qoldiq,0);
    h += `<div class="sect-t">Qarzlar <span>${S.qarzlar.length} ta ochiq</span></div>
      <div class="grid2">
        <div class="stat up"><div class="l">Olishim kerak</div><div class="v">${fmt(ol)}</div></div>
        <div class="stat down"><div class="l">Berishim kerak</div><div class="v">${fmt(ber)}</div></div>
      </div>`;
  }

  $('#home-body').innerHTML = h;
  $$('[data-new]').forEach(b => b.onclick = () => {
    buzz(); setTur(b.dataset.new); show('add');
  });
  bindItems($('#home-body'));
}

function bizById(id){ return S.bizneslar.find(b => b.id === id); }

function itemHTML(r){
  const b = bizById(r.biznes_id) || {rang:['#999','#666'], emoji:'', nomi:''};
  const up = r.tur === 'Kirim';
  const summa = r.valyuta === 'USD'
      ? (up?'+':'−') + '$' + fmt(r.summa)
      : (up?'+':'−') + fmt(r.summa_uzs);
  const kun = r.sana === bugunISO() ? 'Bugun' : r.sana.slice(8,10)+'.'+r.sana.slice(5,7);
  const tolov = r.tolov === 'Naqd' ? '💵' : (r.tolov === 'Karta' ? '💳' : '📝');
  return `<div class="item" data-id="${r.id}">
    <span class="bead" style="background:linear-gradient(180deg,${b.rang[0]},${b.rang[1]})"></span>
    <div class="t">
      <div class="a">${esc(r.izoh || (up ? 'Kirim' : 'Chiqim'))}</div>
      <div class="b">${esc(b.emoji)} ${kun} ${esc(r.vaqt)} · ${tolov} ${esc(r.tolov)}</div>
    </div>
    <div class="amt ${up?'up':'down'}">${summa}</div>
  </div>`;
}

/* ---------- o'chirish ---------- */
let delId = null;
function bindItems(root){
  $$('.item', root).forEach(el => {
    let timer = null;
    const start = () => { timer = setTimeout(()=>{ askDelete(el.dataset.id); }, 550); };
    const stop  = () => clearTimeout(timer);
    el.addEventListener('touchstart', start, {passive:true});
    el.addEventListener('touchend', stop);
    el.addEventListener('touchmove', stop, {passive:true});
    el.addEventListener('mousedown', e => { e.preventDefault(); start(); });
    el.addEventListener('mouseup', stop);
    el.addEventListener('mouseleave', stop);
    window.addEventListener('mouseup', stop);
    window.addEventListener('blur', stop);
  });
}
function askDelete(id){
  delId = id; buzz();
  const r = S.oxirgi.find(x => String(x.id) === String(id));
  $('#sh-p').textContent = r
    ? `«${r.izoh || r.tur}» — ${fmt(r.summa_uzs)} so'm. Qaytarib bo'lmaydi.`
    : 'Qaytarib bo\'lmaydi.';
  $('#sheet').classList.add('on');
}
$('#sh-no').onclick = () => $('#sheet').classList.remove('on');
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); };
$('#sh-yes').onclick = async () => {
  $('#sheet').classList.remove('on');
  try {
    await api('/api/tx/delete', {id: Number(delId)});
    toast('O\'chirildi', 'good'); buzz('ok'); await load();
  } catch(e){ toast(e.message, 'bad'); buzz('err'); }
};

/* ---------- YOZISH ---------- */
function setTur(v){
  sel.tur = v;
  $$('#seg-tur button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
}
$$('#seg-tur button').forEach(b => b.onclick = () => { buzz(); setTur(b.dataset.v); });
$$('#seg-tolov button').forEach(b => b.onclick = () => {
  buzz(); sel.tolov = b.dataset.v;
  $$('#seg-tolov button').forEach(x => x.classList.toggle('on', x === b));
});

function renderBizSeg(){
  const wrap = $('#seg-biz');
  wrap.innerHTML = S.bizneslar.map(b =>
    `<button data-id="${b.id}">${esc(b.emoji)} ${esc(b.nomi)}</button>`).join('');
  $$('button', wrap).forEach(btn => btn.onclick = () => { buzz(); pickBiz(Number(btn.dataset.id)); });
  pickBiz(sel.biz && S.bizneslar.some(b=>b.id===sel.biz) ? sel.biz : (S.bizneslar[0]||{}).id);

  const f = $('#seg-filter');
  f.innerHTML = `<button data-id="0" class="on">Hammasi</button>` + S.bizneslar.map(b =>
    `<button data-id="${b.id}">${esc(b.emoji)} ${esc(b.nomi)}</button>`).join('');
  $$('button', f).forEach(btn => btn.onclick = () => {
    buzz(); filterBiz = Number(btn.dataset.id);
    $$('button', f).forEach(x => x.classList.toggle('on', x === btn));
    if (filterBiz){ const b = bizById(filterBiz);
      btn.style.background = grad(b); btn.style.color = '#fff'; }
    $$('button', f).forEach(x => { if (!x.classList.contains('on')){ x.style.background=''; x.style.color=''; } });
    renderHist();
  });
}
function pickBiz(id){
  sel.biz = id;
  $$('#seg-biz button').forEach(btn => {
    const on = Number(btn.dataset.id) === id;
    btn.classList.toggle('on', on);
    const b = bizById(Number(btn.dataset.id));
    btn.style.background = on && b ? grad(b) : '';
  });
}

function renderAmount(){
  const raw = sel.raqam || '0';
  const n = Number(raw);
  const el = $('#amt');
  el.textContent = sel.usd ? '$' + fmt(n) : fmt(n);
  el.classList.toggle('small', el.textContent.length > 11);
  $('#amt-sub').textContent = sel.usd
    ? `dollar · ≈ ${fmt(n * S.kurs)} so'm`
    : (n ? `so'm · ≈ $${(n/S.kurs).toFixed(2)}` : "so'm");
  $('#save').disabled = !(n > 0);
}
$$('.key[data-k]').forEach(k => k.onclick = () => {
  buzz();
  const v = k.dataset.k;
  if (v === 'del') sel.raqam = sel.raqam.slice(0, -1);
  else if (sel.raqam.length < 12) sel.raqam = (sel.raqam === '0' ? '' : sel.raqam) + v;
  renderAmount();
});
$('#k-usd').onclick = () => {
  buzz(); sel.usd = !sel.usd;
  $('#k-usd').classList.toggle('on', sel.usd);
  renderAmount();
};

$('#save').onclick = async () => {
  const n = Number(sel.raqam);
  if (!(n > 0)) return;
  $('#save').disabled = true;
  try {
    const r = await api('/api/tx', {
      biznes_id: sel.biz, tur: sel.tur, summa: n,
      valyuta: sel.usd ? 'USD' : 'UZS', tolov: sel.tolov,
      izoh: $('#izoh').value
    });
    buzz('ok');
    const b = bizById(sel.biz);
    toast(`${sel.tur === 'Kirim' ? '🟢' : '🔴'} ${b ? b.nomi : ''} · saqlandi`, 'good');
    sel.raqam = ''; sel.usd = false; $('#k-usd').classList.remove('on');
    $('#izoh').value = '';
    renderAmount();
    await load();
    show('home');
  } catch(e){
    buzz('err'); toast(e.message, 'bad');
  }
  $('#save').disabled = false;
};

/* ---------- TARIX ---------- */
function renderHist(){
  const rows = S.oxirgi.filter(r => !filterBiz || r.biznes_id === filterBiz);
  $('#hist-sub').textContent = rows.length + ' ta yozuv';
  if (!rows.length){
    $('#hist-body').innerHTML = `<div class="empty"><span class="e">🔍</span>Yozuv topilmadi</div>`;
    return;
  }
  const guruh = {};
  rows.forEach(r => { (guruh[r.sana] = guruh[r.sana] || []).push(r); });
  const bugun = bugunISO();
  let h = '';
  Object.keys(guruh).sort().reverse().forEach(sana => {
    const list = guruh[sana];
    const foyda = list.reduce((a,r) => a + (r.tur==='Kirim' ? r.summa_uzs : -r.summa_uzs), 0);
    const nom = sana === bugun ? 'Bugun' : sana.slice(8,10)+'.'+sana.slice(5,7)+'.'+sana.slice(0,4);
    h += `<div class="sect-t">${nom}<span>${foyda>=0?'+':'−'}${fmt(Math.abs(foyda))} so'm</span></div>
          <div class="list">${list.map(itemHTML).join('')}</div>`;
  });
  h += `<div class="empty" style="padding:16px 10px;font-size:12.5px">
          Yozuvni o'chirish uchun uzoq bosib turing</div>`;
  $('#hist-body').innerHTML = h;
  bindItems($('#hist-body'));
}

/* ---------- HISOBOT ---------- */
function renderRep(){
  const kunlar = S.kunlar;
  let max = 1;
  kunlar.forEach(k => {
    let s = 0;
    S.bizneslar.forEach(b => { const v = k.biz[String(b.id)]; if (v) s += v.kirim; });
    if (s > max) max = s;
  });

  let bars = '';
  kunlar.forEach((k, idx) => {
    let stack = '';
    S.bizneslar.forEach(b => {
      const v = k.biz[String(b.id)];
      const h = v && v.kirim ? Math.max(2, (v.kirim / max) * 100) : 0;
      if (h) stack += `<i style="height:${h}%;background:linear-gradient(180deg,${b.rang[1]},${b.rang[0]});animation-delay:${idx*60}ms"></i>`;
    });
    bars += `<div class="bar"><div class="stack">${stack||'<i style="height:2px;background:var(--line)"></i>'}</div><em>${k.kun}</em></div>`;
  });

  let oyK = 0, oyC = 0;
  S.bizneslar.forEach(b => { oyK += b.oy.kirim; oyC += b.oy.chiqim; });

  let h = `<div class="chartbox">
      <div class="sect-t" style="margin:0 0 10px">Oxirgi 7 kun · kirim</div>
      <div class="chart">${bars}</div>
      <div class="legend">${S.bizneslar.map(b =>
        `<span><b style="background:${b.rang[0]}"></b>${esc(b.nomi)}</span>`).join('')}</div>
    </div>
    <div class="bigline">
      <div class="l">Shu oy · sof foyda</div>
      <div class="v">${fmt(oyK - oyC)}</div>
      <div class="s">so'm · ≈ $${((oyK-oyC)/S.kurs).toFixed(2)}</div>
    </div>
    <div class="grid2">
      <div class="stat up"><div class="l">Oylik kirim</div><div class="v">${fmt(oyK)}</div></div>
      <div class="stat down"><div class="l">Oylik chiqim</div><div class="v">${fmt(oyC)}</div></div>
    </div>
    <div class="sect-t">Bizneslar bo'yicha</div>`;

  S.bizneslar.forEach(b => {
    const f = b.oy.kirim - b.oy.chiqim;
    h += `<div class="bcard" style="background:${grad(b)}">
      <div class="nm">${esc(b.emoji)} ${esc(b.nomi)}</div>
      <div class="kassa">${fmt(f)}</div>
      <div class="kl">shu oydagi foyda, so'm</div>
      <div class="today"><span>🟢 <b>${fmt(b.oy.kirim)}</b></span><span>🔴 <b>${fmt(b.oy.chiqim)}</b></span></div>
    </div>`;
  });

  h += `<a class="xlsx" href="/api/excel" target="_blank" rel="noopener">📥 Excel yuklab olish</a>`;
  $('#rep-body').innerHTML = h;
}

/* ---------- yuklash ---------- */
async function load(){
  try {
    S = await api('/api/state');
    renderBizSeg();
    renderHome();
    renderHist();
    renderRep();
    renderAmount();
  } catch(e){
    $('#home-body').innerHTML =
      `<div class="empty"><span class="e">🔒</span>${esc(e.message)}</div>`;
  }
}
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
